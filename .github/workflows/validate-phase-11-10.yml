name: Validate Phase 11.10 + 11.11 + 11.12.1-11.12.8 + 12.1 + 12.2 + 12.3 + 12.4 + 12.5 + 12.6 + 12.7 + 12.8 + 12.9 + 12.10

on:
  push:
    branches: [main, phase-11.12.8-cross-episode-narrative-continuity, phase-12.1-global-news-radar-autonomous-editor, phase-12.2-event-intelligence-engine, phase-12.3-autonomous-editorial-decision-brain, phase-12.4-global-importance-engine, phase-12.5-editorial-planning-ai, phase-12.6-autonomous-research, phase-12.7-claim-verification-engine, phase-12.8-autonomous-production-director, phase-12.9-autonomous-quality-council, phase-12.10-autonomous-publishing-brain]
    paths:
      - '.github/workflows/validate-phase-11-10.yml'
      - 'bootstrap/**'
      - 'docs/phase-12.4-global-importance-engine.md'
      - 'docs/phase-12.5-editorial-planning-ai.md'
      - 'docs/phase-12.6-autonomous-research.md'
      - 'docs/phase-12.7-claim-verification-engine.md'
      - 'docs/phase-12.8-autonomous-production-director.md'
      - 'docs/phase-12.9-autonomous-quality-council.md'
      - 'docs/phase-12.10-autonomous-publishing-brain.md'
      - 'materialize.ps1'
      - '.gitmodules'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-phase-11-10.yml'
      - 'bootstrap/**'
      - 'docs/phase-12.4-global-importance-engine.md'
      - 'docs/phase-12.5-editorial-planning-ai.md'
      - 'docs/phase-12.6-autonomous-research.md'
      - 'docs/phase-12.7-claim-verification-engine.md'
      - 'docs/phase-12.8-autonomous-production-director.md'
      - 'docs/phase-12.9-autonomous-quality-council.md'
      - 'docs/phase-12.10-autonomous-publishing-brain.md'
      - 'materialize.ps1'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase-11-continuity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout overlay and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned upstream dependencies for bootstrap verifiers
        shell: pwsh
        working-directory: upstream
        run: |
          npm pkg set "allowScripts.sqlite3=true" --json
          npm install

      # The canonical materializer runs the serialized narrative phases in order,
      # then 12.1 discovers coverage, 12.2 resolves event memory, 12.3 allocates
      # the editorial slot, 12.4 measures structural importance, 12.5 plans the
      # report, 12.6 acquires evidence, 12.7 verifies claim truth, 12.8 creates
      # a production directive, 12.9 applies pre/post-production quality councils,
      # and 12.10 reserves cadence-safe publication slots with breaking preemption.
      - name: Materialize and run all bootstrap regression gates through 12.10
        shell: pwsh
        run: ./materialize.ps1

      - name: Run Phase 11.10 full suite after final materialization
        shell: pwsh
        working-directory: upstream
        run: npm run test:persistent-world-object:full

      - name: Run Phase 11.11 full suite after final materialization
        shell: pwsh
        working-directory: upstream
        run: npm run test:persistent-character:full

      - name: Recheck Phase 11.12.4 visual-binding hardening after final materialization
        shell: pwsh
        working-directory: upstream
        run: node ../bootstrap/verify-phase11-character-arc-visual-binding-hardening.js

      - name: Recheck Phase 11.12.7 Narrative Context Resolver after final materialization
        shell: pwsh
        working-directory: upstream
        run: npm run test:narrative-context-resolver

      - name: Run Phase 11.12.8 Cross-Episode Narrative Continuity Gate suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:narrative-continuity-gate

      - name: Run Phase 12.1 Global News Radar + Autonomous Editor suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:global-news-radar

      - name: Run Phase 12.2 Event Intelligence Engine suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:event-intelligence

      - name: Run Phase 12.3 Autonomous Editorial Decision Brain suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:autonomous-editorial-brain

      - name: Run Phase 12.4 Global Importance Engine suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:global-importance

      - name: Run Phase 12.5 Editorial Planning AI suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:editorial-planning

      - name: Run Phase 12.6 Autonomous Research suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:autonomous-research

      - name: Run Phase 12.7 Evidence / Truth Engine suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:claim-verification

      - name: Run Phase 12.8 Autonomous Production Director suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:autonomous-production-director

      - name: Run Phase 12.9 Autonomous Quality Council suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:autonomous-quality-council

      - name: Run Phase 12.10 Autonomous Publishing Brain suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:autonomous-publishing-brain
