name: Validate Phase 11.10 + 11.11 + 11.12.1 + 11.12.2 + 11.12.3 + 11.12.4

on:
  push:
    branches: [main, phase-11.12.4-character-arc-memory]
    paths:
      - '.github/workflows/validate-phase-11-10.yml'
      - 'bootstrap/**'
      - 'materialize.ps1'
      - '.gitmodules'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-phase-11-10.yml'
      - 'bootstrap/**'
      - 'materialize.ps1'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase-11-continuity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout overlay and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned upstream dependencies for bootstrap verifiers
        shell: pwsh
        working-directory: upstream
        run: |
          npm pkg set "allowScripts.sqlite3=true" --json
          npm install

      - name: Materialize and run all bootstrap regression gates
        shell: pwsh
        run: ./materialize.ps1

      - name: Run Phase 11.10 full suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:persistent-world-object:full

      - name: Run Phase 11.11 full suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:persistent-character:full

      - name: Run Phase 11.12.1 Series Bible suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:series-bible

      - name: Run Phase 11.12.2 Canonical Timeline suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:canonical-timeline

      - name: Run Phase 11.12.3 Episode Memory suite
        shell: pwsh
        working-directory: upstream
        run: npm run test:episode-memory

      - name: Run Phase 11.12.4 Character Arc Memory suite
        shell: pwsh
        working-directory: upstream
        run: |
          npm run test:character-arc-memory
          node ../bootstrap/verify-phase11-character-arc-visual-binding-hardening.js
